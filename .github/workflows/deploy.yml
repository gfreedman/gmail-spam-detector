# =============================================================================
# CI/CD Pipeline — Gmail Spam Detector
#
# Four-stage pipeline: Test → Deploy → Validate → Tag
#   1. test:     Lint JS syntax, run Python detection tests, validate README stats
#   2. deploy:   Push SpamDetector.gs to Google Apps Script via clasp
#   3. validate: Read deployed script back via Apps Script REST API and confirm
#                the expected @version tag is present in the live source
#   4. tag:      Auto-create git tag if commit message contains a version number
#
# Each stage requires the previous to pass (needs:). If tests fail, nothing
# deploys. If deploy or validation fails, no release is created.
#
# Trigger: pushes to main that touch relevant files (source, tests, config,
# workflow, or README). The workflow file itself is included so pipeline
# changes trigger a run.
#
# Secrets required:
#   CLASP_TOKEN — Google OAuth token for clasp CLI authentication
#   SCRIPT_ID   — Google Apps Script project ID to deploy to
# =============================================================================

name: Deploy to Google Apps Script

on:
  push:
    branches: [main]
    # Only run when relevant files change — saves CI minutes on doc-only commits
    paths:
      - 'SpamDetector.gs'            # Main source code
      - 'appsscript.json'            # Apps Script manifest (scopes, runtime)
      - 'tests/**'                   # Test suite and .eml examples
      - '.github/workflows/deploy.yml'  # This workflow (so pipeline changes trigger a run)
      - 'README.md'                  # README stats are validated by CI

# Prevent concurrent deploys — if a new push arrives while deploying,
# cancel the in-progress run (the newer code supersedes it anyway)
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Stage 1: Test
  #
  # Three validation steps:
  #   a. JS syntax lint — catches syntax errors before they reach Apps Script
  #   b. Spam detection tests — verifies all spam caught, no false positives
  #   c. README stats check — ensures documented counts match actual .eml files
  # ===========================================================================
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # Compile SpamDetector.gs as a Node vm.Script — catches syntax errors
      # (missing brackets, invalid regex, etc.) that Apps Script would reject
      - name: Lint SpamDetector.gs syntax
        run: node -e "new (require('vm').Script)(require('fs').readFileSync('SpamDetector.gs','utf8'))"

      # Run the Python test suite: parser self-tests, Gmail API method validation,
      # spam/scam/ham detection, edge cases, and performance benchmark.
      # Exits 1 on failure. Example counts are validated by the README stats check.
      - name: Run spam detection tests
        run: python tests/test_spam_detector.py

      # Validate that README.md test result counts (e.g., "31/31", "11/11")
      # match the actual number of .eml files in the test directories.
      # This prevents the README from going stale when examples are added.
      - name: Check README stats are current
        run: |
          SPAM_COUNT=$(ls tests/spam_examples/*.eml | wc -l | tr -d ' ')
          HAM_COUNT=$(ls tests/ham_examples/*.eml | wc -l | tr -d ' ')
          SCAM_COUNT=$(ls tests/scam_examples/*.eml 2>/dev/null | wc -l | tr -d ' ')
          STALE=0
          if ! grep -q "${SPAM_COUNT}/${SPAM_COUNT}" README.md; then
            echo "::error::README spam count is stale (found $SPAM_COUNT spam examples)"
            STALE=1
          fi
          if ! grep -q "${HAM_COUNT}/${HAM_COUNT}" README.md; then
            echo "::error::README ham count is stale (found $HAM_COUNT ham examples)"
            STALE=1
          fi
          if [ "$SCAM_COUNT" -gt 0 ] && ! grep -q "${SCAM_COUNT}/.*scam" README.md; then
            echo "::error::README scam count is stale (found $SCAM_COUNT scam examples)"
            STALE=1
          fi
          if [ "$STALE" -eq 1 ]; then
            echo "Update the test result counts in README.md to match"
            exit 1
          fi

  # ===========================================================================
  # Stage 2: Deploy
  #
  # Pushes SpamDetector.gs and appsscript.json to Google Apps Script via clasp.
  # Requires CLASP_TOKEN and SCRIPT_ID secrets to be configured in the repo.
  #
  # On failure, writes a summary to the GitHub Actions job summary page
  # with the failing commit SHA and a link to the run details.
  # ===========================================================================
  deploy:
    needs: test  # Only deploy if all tests pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Fail fast with a clear error if secrets aren't configured
      - name: Check secrets
        run: |
          if [ -z "${{ secrets.CLASP_TOKEN }}" ]; then
            echo "::error::CLASP_TOKEN secret not set"
            exit 1
          fi
          if [ -z "${{ secrets.SCRIPT_ID }}" ]; then
            echo "::error::SCRIPT_ID secret not set"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # Cache npm to avoid re-downloading clasp on every run
      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-clasp-${{ runner.os }}

      - name: Install clasp
        run: npm install -g @google/clasp@3.3.0

      # Write the OAuth token to ~/.clasprc.json (clasp's credential file).
      # printf avoids the trailing newline that echo appends, which can cause
      # JSON parse errors in clasp's credential reader.
      - name: Write clasp credentials
        run: printf '%s' '${{ secrets.CLASP_TOKEN }}' > ~/.clasprc.json

      # Write .clasp.json with the target script ID and root directory
      - name: Write clasp config
        run: |
          echo '{"scriptId":"${{ secrets.SCRIPT_ID }}","rootDir":"."}' > .clasp.json

      # Patch @version in SpamDetector.gs to match the commit message version
      # (e.g. "v6.22.0: ..." → @version 6.22.0). This runs only in CI so the
      # deployed script always shows the correct version without requiring a
      # manual source-file edit on every commit.
      - name: Patch @version in SpamDetector.gs
        run: |
          VERSION=$(git log -1 --pretty=%s | grep -oP 'v\d+\.\d+\.\d+' || true)
          if [ -n "$VERSION" ]; then
            VER_NUM="${VERSION#v}"
            sed -i "s/@version .*/@version ${VER_NUM}/" SpamDetector.gs
            grep -q "@version ${VER_NUM}" SpamDetector.gs \
              || { echo "::error::@version patch failed — sed found no match in SpamDetector.gs"; exit 1; }
            echo "Patched @version to ${VER_NUM}"
          else
            echo "No version in commit message — @version left unchanged"
          fi

      # Push source files to Google Apps Script (--force overwrites remote)
      - name: Push to Apps Script
        run: clasp push --force

      # On deploy failure, write a summary with commit SHA and link to the run
      - name: Notify deploy failure
        if: failure()
        run: |
          echo "## Deploy Failed" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "See [run details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Stage 3: Validate
  #
  # Reads the deployed script back from the Apps Script REST API and confirms
  # the expected @version string is present in the live source. This catches
  # silent deploy failures where clasp exits 0 but the remote wasn't updated.
  #
  # Token note: CLASP_TOKEN only carries a refresh_token at rest (the
  # access_token written at clasp login has long expired). We exchange it for
  # a fresh access_token via the Google OAuth2 endpoint using Python stdlib —
  # no clasp or Node.js required in this job.
  #
  # If the API call itself fails (network error, unexpected response format),
  # the step warns but does not block the pipeline — clasp push is the ground
  # truth. A missing @version string, however, is a hard failure.
  # ===========================================================================
  validate:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Write clasp credentials
        run: printf '%s' '${{ secrets.CLASP_TOKEN }}' > ~/.clasprc.json

      # Exchange refresh_token for a fresh access_token via the OAuth2 endpoint.
      # Reads client_id + client_secret from ~/.clasprc.json (written above), calls
      # Google's token endpoint with stdlib urllib — no clasp or Node.js needed.
      # Writes the fresh access_token back into ~/.clasprc.json for the next step.
      - name: Refresh OAuth token
        run: |
          python3 -c "
          import json,os,urllib.request,urllib.parse
          d=json.load(open(os.path.expanduser('~/.clasprc.json')))
          t=d.get('token') or d
          oa=d.get('oauth2ClientSettings',{})
          p={'client_id':oa.get('clientId',d.get('client_id','')),'client_secret':oa.get('clientSecret',d.get('client_secret','')),'refresh_token':t['refresh_token'],'grant_type':'refresh_token'}
          r=json.loads(urllib.request.urlopen(urllib.request.Request('https://oauth2.googleapis.com/token',urllib.parse.urlencode(p).encode())).read())
          t['access_token']=r['access_token']
          if 'token' in d: d['token']=t
          else: d.update(t)
          json.dump(d,open(os.path.expanduser('~/.clasprc.json'),'w'))
          print('Token refreshed successfully')
          "

      - name: Validate deployed version via Apps Script API
        env:
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          VERSION=$(git log -1 --pretty=%s | grep -oP 'v\d+\.\d+\.\d+' || true)
          if [ -z "$VERSION" ]; then
            echo "No version in commit — skipping API validation"
            exit 0
          fi
          VER_NUM="${VERSION#v}"
          echo "Checking that @version $VER_NUM is live in Google Apps Script..."

          ACCESS_TOKEN=$(python3 -c "import json,os; d=json.load(open(os.path.expanduser('~/.clasprc.json'))); t=d.get('token') or d; print(t['access_token'])")

          # Fetch the deployed script content via the Apps Script REST API.
          # -s = silent (no progress bar), -o = write body to file,
          # -w = write HTTP status code to stdout for our check below.
          HTTP_CODE=$(curl -s \
            -o /tmp/gas_content.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://script.googleapis.com/v1/projects/${SCRIPT_ID}/content")

          if [ "$HTTP_CODE" != "200" ]; then
            # Non-200 means auth error, quota, or API unavailable.
            # Warn but don't block — clasp push already confirmed the upload.
            echo "::warning::Apps Script API returned HTTP $HTTP_CODE — skipping version check"
            echo "API response:" && cat /tmp/gas_content.json
            exit 0
          fi

          # The response is JSON: {"files": [{"name": "...", "source": "..."}]}
          # grep for the @version string in the raw JSON (safe — no special chars).
          if grep -q "@version ${VER_NUM}" /tmp/gas_content.json; then
            echo "✅ Confirmed: @version $VER_NUM is live in Google Apps Script"
            {
              echo "## ✅ ${VERSION} deployed and verified"
              echo ""
              echo "The new version is live. Ready to test."
              echo ""
              echo "> **Before testing:** Run \`refreshBlacklist()\` in the Apps Script"
              echo "> editor to sync new blacklist entries into Script Properties."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::@version $VER_NUM was NOT found in the live script — possible silent deploy failure"
            echo "Apps Script API response:" && cat /tmp/gas_content.json
            exit 1
          fi

  # ===========================================================================
  # Stage 4: Tag
  #
  # Auto-creates a git tag when the commit message contains a version number
  # (e.g., "v6.11.1: Fix spam deletion"). This links deployed versions to
  # specific commits for easy rollback and audit.
  #
  # Requires contents:write permission to push tags.
  # Harmlessly fails if the tag already exists (e.g., reusing a version).
  # ===========================================================================
  tag:
    needs: validate  # Only tag after deploy is confirmed live
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push git tags
    steps:
      - uses: actions/checkout@v5

      - name: Auto-tag version commits
        run: |
          VERSION=$(git log -1 --pretty=%s | grep -oP 'v\d+\.\d+\.\d+' || true)
          if [ -n "$VERSION" ]; then
            git tag "$VERSION" 2>/dev/null || true
            if git push origin "$VERSION" 2>/dev/null; then
              echo "Tagged $VERSION" >> $GITHUB_STEP_SUMMARY
            else
              echo "Tag $VERSION already exists — skipping" >> $GITHUB_STEP_SUMMARY
            fi
          fi
