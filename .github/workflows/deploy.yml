# =============================================================================
# CI/CD Pipeline — Gmail Spam Detector
#
# Four-stage pipeline: Test → Deploy → Validate → Tag
#   1. test:     Lint JS syntax, run Python detection tests, validate README stats
#   2. deploy:   Push the .gs sources in sources.json to Apps Script via clasp
#   3. validate: Read deployed script back via Apps Script REST API and confirm
#                the expected @version tag is present in the live source
#   4. tag:      Auto-create git tag if commit message contains a version number
#
# Each stage requires the previous to pass (needs:). If tests fail, nothing
# deploys. If deploy or validation fails, no release is created.
#
# Trigger: pushes to main that touch relevant files (source, tests, config,
# workflow, or README). The workflow file itself is included so pipeline
# changes trigger a run.
#
# Secrets required:
#   CLASP_TOKEN — Google OAuth token for clasp CLI authentication
#   SCRIPT_ID   — Google Apps Script project ID to deploy to
# =============================================================================

name: Deploy to Google Apps Script

on:
  push:
    branches: [main]
    # Only run when relevant files change — saves CI minutes on doc-only commits
    paths:
      - '*.gs'                       # Apps Script source at the repo root
      - '**/*.gs'                    # ...and in any subdirectory (Phase 1 may use src/)
                                     # BOTH are listed deliberately: '**' is documented
                                     # as matching zero or more characters, so '**/*.gs'
                                     # may reduce to '/*.gs' and miss root-level files.
                                     # A path filter that silently stops matching is the
                                     # same failure as the workflow-file omission.
      - 'sources.json'               # The source manifest itself
      - 'src/appsscript.json'        # Apps Script manifest (scopes, runtime)
      - 'tests/**'                   # Test suite and .eml examples
      - 'scripts/**'                 # patch_version.js runs IN the deploy job
      - '.claspignore'               # Controls which files clasp uploads
      - '.github/workflows/deploy.yml'  # This workflow (so pipeline changes trigger a run)
      - 'README.md'                  # README stats are validated by CI
      - 'docs/**'                    # docs/index.html is the published Pages site

# Prevent concurrent deploys — if a new push arrives while deploying,
# cancel the in-progress run (the newer code supersedes it anyway)
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Stage 1: Test
  #
  # Three validation steps:
  #   a. JS syntax lint — catches syntax errors before they reach Apps Script
  #   b. Spam detection tests — verifies all spam caught, no false positives
  #   c. README stats check — ensures documented counts match actual .eml files
  # ===========================================================================
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # Compile the source as a Node vm.Script — catches syntax errors (missing
      # brackets, invalid regex, etc.) that Apps Script would reject.
      #
      # Lints the CONCATENATION of every file in sources.json, because that is
      # what Apps Script runs: all .gs files share one global scope. Linting
      # files separately would miss a duplicate top-level declaration across
      # two files, which is a load-time SyntaxError in production and silence
      # here.
      - name: Lint Apps Script syntax
        run: node -e "new (require('vm').Script)(require(process.env.GITHUB_WORKSPACE + '/scripts/sources.js').concatSource())"

      # Run the Python test suite: parser self-tests, Gmail API method validation,
      # spam/scam/ham detection, edge cases, JS/Python signal parity, and the
      # performance benchmark. Exits 1 on failure.
      #
      # Phase 7 (parity) shells out to `node tests/parity_signals.js`, so it
      # depends on the Setup Node.js step above — keep Node before this step.
      - name: Run spam detection tests
        run: python tests/test_spam_detector.py

      # Disposition tests — the only automated coverage of the code that
      # IRREVERSIBLY deletes mail. Loads the concatenated source into a vm with
      # GmailApp/Gmail/PropertiesService stubbed and asserts on the recorded
      # call log: Rule 7 must never issue batchDelete or add the SPAM label,
      # Rules 1-6 must still delete exactly one id, and a quarantine must be
      # terminal across repeated runs. The Python harness cannot reach this
      # code (no Apps Script runtime), which is why two consecutive releases
      # shipped disposition bugs with a green suite.
      - name: Run disposition tests
        run: node tests/test_disposition.js

      # Link-graph tests — URL host parsing, domain matching and Signal 7,
      # asserted against the shipped JavaScript directly. Every row is a real
      # bypass or false positive found in review. (Mirror drift itself is now
      # caught by Phase 7 of the Python suite, which compares both
      # implementations over every fixture.)
      - name: Run link-graph tests
        run: node tests/test_link_graph.js

      # Covers scripts/patch_version.js, which the deploy job runs. A broken
      # version patch fails the deploy AFTER tests pass, so it is tested here.
      - name: Run version-patch tests
        run: node tests/test_patch_version.js

      # Repo consistency checks (version markers, README stats, doc freshness).
      # Previously unwired, so it silently rotted until a review ran it by hand.
      - name: Validate repo consistency
        run: python scripts/validate.py

      # Validate that README.md test result counts (e.g., "31/31", "11/11")
      # match the actual number of .eml files in the test directories.
      # This prevents the README from going stale when examples are added.
      - name: Check README stats are current
        run: |
          SPAM_COUNT=$(ls tests/spam_examples/*.eml | wc -l | tr -d ' ')
          HAM_COUNT=$(ls tests/ham_examples/*.eml | wc -l | tr -d ' ')
          SCAM_COUNT=$(ls tests/scam_examples/*.eml 2>/dev/null | wc -l | tr -d ' ')
          STALE=0
          if ! grep -q "${SPAM_COUNT}/${SPAM_COUNT}" README.md; then
            echo "::error::README spam count is stale (found $SPAM_COUNT spam examples)"
            STALE=1
          fi
          if ! grep -q "${HAM_COUNT}/${HAM_COUNT}" README.md; then
            echo "::error::README ham count is stale (found $HAM_COUNT ham examples)"
            STALE=1
          fi
          if [ "$SCAM_COUNT" -gt 0 ] && ! grep -q "${SCAM_COUNT}/.*scam" README.md; then
            echo "::error::README scam count is stale (found $SCAM_COUNT scam examples)"
            STALE=1
          fi
          if [ "$STALE" -eq 1 ]; then
            echo "Update the test result counts in README.md to match"
            exit 1
          fi

  # ===========================================================================
  # Stage 2: Deploy
  #
  # Pushes every file in sources.json plus appsscript.json via clasp.
  # Requires CLASP_TOKEN and SCRIPT_ID secrets to be configured in the repo.
  #
  # On failure, writes a summary to the GitHub Actions job summary page
  # with the failing commit SHA and a link to the run details.
  # ===========================================================================
  deploy:
    needs: test  # Only deploy if all tests pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Fail fast with a clear error if secrets aren't configured
      - name: Check secrets
        run: |
          if [ -z "${{ secrets.CLASP_TOKEN }}" ]; then
            echo "::error::CLASP_TOKEN secret not set"
            exit 1
          fi
          if [ -z "${{ secrets.SCRIPT_ID }}" ]; then
            echo "::error::SCRIPT_ID secret not set"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # Cache npm to avoid re-downloading clasp on every run
      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-clasp-${{ runner.os }}

      - name: Install clasp
        run: npm install -g @google/clasp@3.3.0

      # Write the OAuth token to ~/.clasprc.json (clasp's credential file).
      # printf avoids the trailing newline that echo appends, which can cause
      # JSON parse errors in clasp's credential reader.
      - name: Write clasp credentials
        run: printf '%s' '${{ secrets.CLASP_TOKEN }}' > ~/.clasprc.json

      # Write .clasp.json with the target script ID, root directory and the
      # manifest's file order.
      #
      # filePushOrder matters because Apps Script concatenates every .gs file
      # into one global scope in project order. sources.json calls itself the
      # concatenation order and the CI syntax lint honours it; without pinning
      # it here, clasp would decide the remote order itself and the program CI
      # linted would not provably be the program Apps Script builds. Harmless
      # under the current no-top-level-statements invariant, but that invariant
      # is not enforced by anything, so do not rely on it.
      - name: Write clasp config
        env:
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          python3 - << 'PYEOF'
          import json, os, sys
          sys.path.insert(0, os.path.join(os.environ['GITHUB_WORKSPACE'], 'scripts'))
          import sources
          # appsscript.json FIRST, so the push order is byte-identical to what
          # clasp produces today (its unlisted-file fallback sorts
          # alphabetically, which already puts appsscript.json ahead of
          # the sources). Pinning the source order should not
          # also quietly change the request shape of a working deploy of a
          # script that deletes mail.
          # rootDir comes from the manifest so the layout is declared in one
          # place. clasp strips it, so src/Config.gs deploys as 'Config'.
          #
          # filePushOrder is REPO-relative ('src/Config.gs') — it is matched
          # against localPath. This is NOT the same convention as .claspignore,
          # which is rootDir-relative. See the note in sources.json.
          root = sources.root_dir()
          cfg = {
              'scriptId': os.environ['SCRIPT_ID'],
              'rootDir': root,
              'filePushOrder': [root + '/appsscript.json'] + sources.source_names(),
          }
          with open('.clasp.json', 'w', encoding='utf-8') as fh:
              json.dump(cfg, fh)
          print('clasp push order: %s' % ', '.join(cfg['filePushOrder']))
          PYEOF

      # Patch @version in the manifest's versionFile to match the commit version
      # (e.g. "v6.22.0: ..." → @version 6.22.0). This runs only in CI so the
      # deployed script always shows the correct version without requiring a
      # manual source-file edit on every commit.
      # Patch both version markers via a tested script rather than inline sed.
      # The previous sed had to survive YAML block-scalar, shell double-quote
      # and sed-expression quoting simultaneously; the anchored form parsed on
      # BSD sed locally and died on GNU sed in CI with "unterminated `s'
      # command" — after the test job had already gone green. scripts/
      # patch_version.js is covered by tests/test_patch_version.js in the test
      # job, so this class of failure is caught before deploy.
      - name: Patch version in the source
        run: |
          # ANCHORED to the start of the subject. The release convention is
          # "v6.X.0: description", so only a LEADING version is the version.
          #
          # Unanchored, any version string anywhere in the subject won. The
          # commit "Delete the tombstone comment for two functions removed in
          # v6.47.0" carried no release version at all, but matched v6.47.0 and
          # deployed 6.62.0's code stamped 6.47.0 — a silent mislabel that
          # passed every check, because that commit had no version to validate
          # against and the deployed-file assertion only compares names.
          #
          # head -n1 is kept: grep -oP prints every match on its own line, and a
          # subject like "v6.45.1: Fix the deploy that blocked v6.45.0" would
          # otherwise yield a two-line $VERSION. With the anchor it can match at
          # most once, but the guard costs nothing and the two failure modes are
          # independent. The same expression is used at the validate and tag
          # sites below.
          VERSION=$(git log -1 --pretty=%s | grep -oP '^v\d+\.\d+\.\d+' | head -n1 || true)
          if [ -n "$VERSION" ]; then
            node scripts/patch_version.js "${VERSION#v}"
          else
            echo "No version in commit message — version markers left unchanged"
          fi

      # Ask clasp what it is ABOUT to push, and refuse if the manifest is not
      # fully in that set.
      #
      # Now that .claspignore denies *.gs, the "!" whitelist is load-bearing —
      # and a slip in it means `clasp push --force` replaces the remote with
      # appsscript.json alone, DELETING the deployed detector. The validate job
      # would only notice afterwards. tests/test_patch_version.js greps for a
      # literal "!<file>" line, which a reordering or a broader deny pattern
      # could satisfy while clasp still resolved the file away.
      #
      # This uses clasp's own resolution instead of guessing at it. Fail-safe by
      # design: if `clasp status --json` cannot be run or parsed we warn and let
      # the push proceed, because the string-level guard in `test` already ran
      # and a new hard dependency on this command's output shape is its own way
      # to break a deploy.
      - name: Assert clasp will push every manifest file
        run: |
          if ! timeout 60 clasp status --json > /tmp/clasp_status.json 2>/tmp/clasp_status.err; then
            echo "::warning::'clasp status --json' failed — skipping the pre-push check"
            cat /tmp/clasp_status.err || true
            exit 0
          fi
          python3 - << 'PYEOF'
          import json, os, sys
          sys.path.insert(0, os.path.join(os.environ['GITHUB_WORKSPACE'], 'scripts'))
          import sources

          try:
              with open('/tmp/clasp_status.json', encoding='utf-8') as fh:
                  status = json.load(fh)
              to_push = status['filesToPush']
          except (ValueError, OSError, KeyError, TypeError) as e:
              print('::warning::Could not read filesToPush from clasp status '
                    '(%s) — skipping the pre-push check' % e)
              sys.exit(0)

          pushing = {os.path.normpath(p) for p in to_push}
          missing = [f for f in sources.source_names()
                     if os.path.normpath(f) not in pushing]
          if missing:
              print('::error::clasp would NOT push: %s' % ', '.join(missing))
              print('::error::Pushing now would replace the remote WITHOUT these '
                    'files. Check the "!" whitelist in .claspignore.')
              print('clasp would push: %s' % ', '.join(sorted(pushing)))
              sys.exit(1)

          print('✅ clasp will push all %d manifest file(s): %s'
                % (len(sources.source_names()), ', '.join(sources.source_names())))
          PYEOF

      # Push source files to Google Apps Script (--force overwrites remote)
      - name: Push to Apps Script
        run: clasp push --force

      # On deploy failure, write a summary with commit SHA and link to the run
      - name: Notify deploy failure
        if: failure()
        run: |
          echo "## Deploy Failed" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "See [run details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Stage 3: Validate
  #
  # Reads the deployed script back from the Apps Script REST API and confirms
  # the expected @version string is present in the live source. This catches
  # silent deploy failures where clasp exits 0 but the remote wasn't updated.
  #
  # Token note: CLASP_TOKEN only carries a refresh_token at rest (the
  # access_token written at clasp login has long expired). We exchange it for
  # a fresh access_token via the Google OAuth2 endpoint using Python stdlib —
  # no clasp or Node.js required in this job.
  #
  # If the API call itself fails (network error, unexpected response format),
  # the step warns but does not block the pipeline — clasp push is the ground
  # truth. A missing @version string, however, is a hard failure.
  # ===========================================================================
  validate:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Write clasp credentials
        run: printf '%s' '${{ secrets.CLASP_TOKEN }}' > ~/.clasprc.json

      # Try to exchange refresh_token for a fresh access_token.
      # If the CLASP_TOKEN secret has no refresh_token (e.g. was captured without one),
      # this step warns and continues — the validate step will use any existing
      # access_token in the secret, or skip if none is available.
      - name: Refresh OAuth token
        continue-on-error: true
        run: |
          python3 - << 'PYEOF'
          import json, os, sys, urllib.request, urllib.parse
          path = os.path.expanduser('~/.clasprc.json')
          d = json.load(open(path))
          # clasp uses 'token' (singular), 'tokens.default' (clasp@3.x), or flat structure
          t = d.get('token') or (d.get('tokens') or {}).get('default') or d.get('tokens') or d
          # Print key structure (not values) for debugging
          print(f'clasprc top-level keys: {sorted(d.keys())}', file=sys.stderr)
          nested_key = 'token' if 'token' in d else 'tokens' if 'tokens' in d else None
          if nested_key:
              print(f'{nested_key} sub-keys: {sorted(t.keys())}', file=sys.stderr)
          refresh_token = t.get('refresh_token')
          if not refresh_token:
              print('No refresh_token in credentials — cannot refresh. '
                    'Regenerate CLASP_TOKEN secret via: clasp login && cat ~/.clasprc.json',
                    file=sys.stderr)
              sys.exit(1)
          oa = d.get('oauth2ClientSettings', t.get('oauth2ClientSettings', {}))
          cid = oa.get('clientId', d.get('client_id', t.get('client_id', '')))
          csec = oa.get('clientSecret', d.get('client_secret', t.get('client_secret', '')))
          if not cid or not csec:
              print(f'No client credentials. oauth2ClientSettings keys: {sorted(oa.keys())}', file=sys.stderr)
              sys.exit(1)
          params = {'client_id': cid, 'client_secret': csec,
                    'refresh_token': refresh_token, 'grant_type': 'refresh_token'}
          resp = json.loads(urllib.request.urlopen(
              urllib.request.Request('https://oauth2.googleapis.com/token',
                                     urllib.parse.urlencode(params).encode())).read())
          if 'access_token' not in resp:
              print(f'OAuth refresh failed — response keys: {list(resp.keys())}', file=sys.stderr)
              sys.exit(1)
          t['access_token'] = resp['access_token']
          if 'token' in d:
              d['token'] = t
          else:
              d.update(t)
          json.dump(d, open(path, 'w'))
          print('Token refreshed successfully')
          PYEOF

      # Fetch the deployed source ONCE, unconditionally, for the two checks
      # that follow.
      #
      # This used to live inside the version check, behind its "no version in
      # the commit subject — skip" guard. That made the deployed-file assertion
      # dead on precisely the commits it was written for: a subject like
      # "split SpamDetector.gs into 21 files" carries no version, so the
      # fetch never ran, the response file never existed, and the assertion
      # warned and skipped. The fetch has nothing to do with the version.
      - name: Fetch deployed source from the Apps Script API
        env:
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          rm -f /tmp/gas_content.json

          ACCESS_TOKEN=$(python3 -c "
          import json,os
          d=json.load(open(os.path.expanduser('~/.clasprc.json')))
          t=d.get('token') or (d.get('tokens') or {}).get('default') or d.get('tokens') or d
          print(t.get('access_token',''))
          ")
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::warning::No access_token available — skipping API validation"
            echo "To fix: regenerate the CLASP_TOKEN secret via 'clasp login && cat ~/.clasprc.json'"
            exit 0
          fi

          # Fetch the deployed script content via the Apps Script REST API.
          # -s = silent (no progress bar), -o = write body to file,
          # -w = write HTTP status code to stdout for our check below.
          HTTP_CODE=$(curl -s \
            -o /tmp/gas_content.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://script.googleapis.com/v1/projects/${SCRIPT_ID}/content")

          if [ "$HTTP_CODE" != "200" ]; then
            # Non-200 means auth error, quota, or API unavailable.
            # Warn but don't block — clasp push already confirmed the upload.
            echo "::warning::Apps Script API returned HTTP $HTTP_CODE — skipping API checks"
            echo "API response:" && cat /tmp/gas_content.json
            # Removed so the steps below see "no response" rather than parsing
            # an error body as if it were a file listing.
            rm -f /tmp/gas_content.json
            exit 0
          fi
          echo "Fetched deployed source from the Apps Script API"

      - name: Validate deployed version
        run: |
          VERSION=$(git log -1 --pretty=%s | grep -oP '^v\d+\.\d+\.\d+' | head -n1 || true)
          if [ -z "$VERSION" ]; then
            echo "No version in commit — skipping version check"
            exit 0
          fi
          if [ ! -s /tmp/gas_content.json ]; then
            echo "::warning::No API response body — skipping version check"
            exit 0
          fi
          VER_NUM="${VERSION#v}"
          echo "Checking that @version $VER_NUM is live in Google Apps Script..."

          # The response is JSON: {"files": [{"name": "...", "source": "..."}]}
          # grep for the @version string in the raw JSON (safe — no special chars).
          if grep -q "@version ${VER_NUM}" /tmp/gas_content.json; then
            echo "✅ Confirmed: @version $VER_NUM is live in Google Apps Script"
            # No manual refreshBlacklist()/refreshWhitelist() needed:
            # getBlacklist()/getWhitelist() merge DEFAULT_DOMAINS at runtime,
            # so new source-code domain entries are effective immediately after
            # clasp push — Script Properties stores only user-added custom entries.
            {
              echo "## ✅ ${VERSION} deployed and verified"
              echo ""
              echo "The new version is live and ready to use."
              echo "Domain list changes take effect immediately — no manual refresh required."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::@version $VER_NUM was NOT found in the live script — possible silent deploy failure"
            echo "Apps Script API response:" && cat /tmp/gas_content.json
            exit 1
          fi

      # Assert the deployed FILE SET matches sources.json.
      #
      # The @version check above proves a version string is live. With one
      # source file that was the whole story; with several it is not, because
      # .claspignore is deny-by-default with an explicit "!" whitelist. A
      # manifest file with no "!" line is tested locally, passes every suite,
      # and is then silently never uploaded — and this job would still go green,
      # because the one file carrying @version did make it. That is a
      # half-deployed detector reporting healthy, which is the exact failure
      # mode the audit and health work exists to prevent.
      #
      # Reuses /tmp/gas_content.json from the step above. If that step took one
      # of its warn-and-continue paths the file is absent or not JSON; warn and
      # skip here too rather than inventing a failure, since clasp push remains
      # the ground truth.
      - name: Assert deployed files match the manifest
        run: |
          if [ ! -s /tmp/gas_content.json ]; then
            echo "::warning::No API response body — skipping deployed-file assertion"
            exit 0
          fi
          python3 - << 'PYEOF'
          import json, sys, os
          sys.path.insert(0, os.path.join(os.environ['GITHUB_WORKSPACE'], 'scripts'))
          import sources

          try:
              with open('/tmp/gas_content.json', encoding='utf-8') as fh:
                  payload = json.load(fh)
          except (ValueError, OSError) as e:
              print('::warning::Could not parse the API response (%s) — '
                    'skipping deployed-file assertion' % e)
              sys.exit(0)

          files = payload.get('files')
          if not isinstance(files, list):
              print('::warning::API response has no "files" array — skipping')
              sys.exit(0)

          # Apps Script strips the extension and types .gs as SERVER_JS.
          # Compared as an ORDERED list, not a set: project order is
          # concatenation order, and the syntax lint upstream validated one
          # specific concatenation. A set comparison would pass on a remote
          # whose order differs from the one CI proved parses.
          # clasp's actual rule (files.js:233-235): the remote name is the
          # ROOTDIR-RELATIVE path minus the extension — so src/sub/X.gs would
          # deploy as "sub/X", not "X". basename() only coincides while the
          # layout is flat, and this repo has already moved its sources once.
          # clasp_relative() is the manifest's own helper, so there is one
          # derivation of the rule rather than two.
          deployed = [f.get('name') for f in files if f.get('type') == 'SERVER_JS']
          expected = [os.path.splitext(sources.clasp_relative(n))[0]
                      for n in sources.source_names()]

          missing = sorted(set(expected) - set(deployed))
          extra   = sorted(set(deployed) - set(expected))

          if missing:
              print('::error::NOT deployed: %s — check the "!" whitelist in '
                    '.claspignore' % ', '.join(missing))
          if extra:
              print('::error::Deployed but not in sources.json: %s — a stale '
                    'remote file shadows nothing locally and is never tested'
                    % ', '.join(extra))
          # Order is a HARD FAILURE.
          #
          # It was a warning until the 21-file deploy (run 35377133412), which
          # was the first time this predicate could execute at all: with one
          # SERVER_JS file it was unfalsifiable, so failing on it would have
          # been a guess. That run returned the files in manifest order, which
          # establishes both that filePushOrder takes effect and that
          # projects.getContent preserves project order.
          #
          # So a mismatch now means something actually changed, and it matters:
          # project order is concatenation order, and the syntax lint upstream
          # validated one specific concatenation. A differently-ordered remote
          # is a program CI has not parsed.
          if not missing and not extra and deployed != expected:
              print('::error::Deployed files are in a different order than '
                    'sources.json — the concatenation CI linted is not the one '
                    'Apps Script builds. Check filePushOrder in .clasp.json.')
          if missing or extra or deployed != expected:
              print('Deployed: %s' % ', '.join(deployed))
              print('Expected: %s' % ', '.join(expected))
              sys.exit(1)

          print('✅ Deployed files match sources.json (%d file(s), in order): %s'
                % (len(expected), ', '.join(expected)))
          PYEOF

  # ===========================================================================
  # Stage 3b: Verify prod
  #
  # `validate` proves the new source is LIVE in Apps Script. It does not prove
  # the script still RUNS. Those are different failures, and the second one has
  # actually happened here: a deploy can leave syntactically valid code that
  # throws on every trigger, and nothing downstream would notice — the detector
  # writes no Sheet rows when it is broken, which is indistinguishable from a
  # quiet mailbox.
  #
  # So this asks prod itself. scripts/prod_health.py reads the Drive marker the
  # detector renames each run (see updateHealthMarker) and checks three things:
  # the trigger is running, the LIVE version matches this commit, and the last
  # run completed clean with no audit findings.
  #
  # It cannot prevent a bad deploy — the push already happened. It is detection,
  # not prevention: a red X tied to the change that caused it.
  #
  # Polls because the marker only updates when the trigger next fires (~1 min).
  # A version change bypasses the health throttle (v6.59.0) specifically so this
  # does not have to wait out the 5-minute quiet-run interval.
  #
  # Runs in parallel with `tag` rather than before it: tagging is bookkeeping and
  # should not be blocked by a runtime health problem.
  # ===========================================================================
  verify-prod:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Write clasp credentials
        run: printf '%s' '${{ secrets.CLASP_TOKEN }}' > ~/.clasprc.json

      - name: Ask prod whether it is healthy
        run: |
          # Window arithmetic, learned the hard way: this job first shipped with
          # a 6-minute poll and failed, because the marker was arriving every 10
          # minutes — the live trigger is on a 10-minute interval, which the
          # README now documents. The budget must be
          #   trigger interval (<=10) + margin
          # A version change bypasses the 5-minute health throttle, so the first
          # run on new code writes immediately and the throttle adds nothing
          # here. 20 x 45s = 15 min.
          for i in $(seq 1 20); do
            echo "── attempt $i/20"
            if python3 scripts/prod_health.py --max-age-min 15; then
              {
                echo "## ✅ Prod verified healthy"
                echo ""
                echo "Trigger running, live version matches this commit, last run clean."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            [ "$i" -lt 20 ] && sleep 45
          done

          echo "::error::prod did not report healthy after ~15 minutes"
          {
            echo "## ❌ Prod did NOT report healthy"
            echo ""
            echo "The new source is live (validate passed) but the running script"
            echo "is not reporting a clean run on this version. Check, in order:"
            echo ""
            echo "1. **Health tab** in the Spam Intelligence Log — \`Status\` and \`LastError\`."
            echo "2. **Raw Log tab** for \`AUDIT_LOG_GAP\` / \`AUDIT_SPAM_NOT_ACTIONED\` rows."
            echo "3. The Apps Script **execution transcript**, if the script throws before it can report."
            echo ""
            echo "If the trigger is gone, re-create it in the Apps Script editor:"
            echo "Triggers -> Add Trigger -> processInbox, time-driven, minutes timer."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # ===========================================================================
  # Stage 4: Tag
  #
  # Auto-creates a git tag when the commit message contains a version number
  # (e.g., "v6.11.1: Fix spam deletion"). This links deployed versions to
  # specific commits for easy rollback and audit.
  #
  # Requires contents:write permission to push tags.
  # Harmlessly fails if the tag already exists (e.g., reusing a version).
  # ===========================================================================
  tag:
    needs: validate  # Only tag after deploy is confirmed live
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push git tags
    steps:
      - uses: actions/checkout@v5

      - name: Auto-tag version commits
        run: |
          VERSION=$(git log -1 --pretty=%s | grep -oP '^v\d+\.\d+\.\d+' | head -n1 || true)
          if [ -n "$VERSION" ]; then
            git tag "$VERSION" 2>/dev/null || true
            if git push origin "$VERSION" 2>/dev/null; then
              echo "Tagged $VERSION" >> $GITHUB_STEP_SUMMARY
            else
              echo "Tag $VERSION already exists — skipping" >> $GITHUB_STEP_SUMMARY
            fi
          fi
