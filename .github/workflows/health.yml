# =============================================================================
# Scheduled prod health check — Gmail Spam Detector
#
# The deploy pipeline's verify-prod job only looks right after a deploy. Most
# ways this detector dies have nothing to do with a deploy:
#
#   * the time-driven trigger is deleted or silently stops firing
#   * the daily Gmail quota is exhausted
#   * the OAuth grant is revoked or expires
#   * a Drive/Sheets permission changes underneath it
#
# The failure that motivated all of this — six obvious spam messages sitting in
# the folder across two releases — was exactly this shape: nothing was broken at
# deploy time, and nothing told anyone afterwards. A deploy-time-only check
# would have missed it completely.
#
# So ask prod the same question on a schedule. Half-hourly is a deliberate
# floor: the detector runs every minute, so 30 minutes bounds how long a stall
# can hide while keeping this well inside free CI minutes.
#
# Secrets required: CLASP_TOKEN (same secret the deploy pipeline uses)
# =============================================================================

name: Prod health

on:
  schedule:
    - cron: '*/30 * * * *'
  # Manual run, for confirming a fix without waiting for the next slot.
  workflow_dispatch:

# Never let two health checks overlap; a queued one tells you nothing new.
concurrency:
  group: prod-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Write clasp credentials
        run: printf '%s' '${{ secrets.CLASP_TOKEN }}' > ~/.clasprc.json

      - name: Ask prod whether it is healthy
        run: |
          # No version assertion here: this runs against whatever is deployed,
          # which is the point. Staleness is the signal — the marker timestamp
          # must be recent. 12 min tolerates a couple of missed 1-minute
          # executions and the 5-minute quiet-run health throttle.
          if python3 scripts/prod_health.py --max-age-min 12; then
            echo "## ✅ Prod healthy" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::error::prod is not healthy"
          {
            echo "## ❌ Prod is not healthy"
            echo ""
            echo "Check, in order:"
            echo "1. **Health tab** in the Spam Intelligence Log — \`Status\` and \`LastError\`."
            echo "2. **Raw Log tab** for \`AUDIT_*\` rows."
            echo "3. Whether the time-driven trigger still exists (\`setupTrigger()\` re-creates it)."
            echo "4. Whether the daily Gmail quota is exhausted (it resets on Pacific midnight)."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
